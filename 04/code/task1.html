<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Task 1</title>
  </head>
  <body>
    <header>
      <h1>Welcome to the Media Queries Example</h1>
    </header>

    <div class="container">
      <aside class="sidebar">
        <h2>Sidebar</h2>
        <p>
          This sidebar will also change its background color based on the
          viewport width.
        </p>
      </aside>

      <article class="mainContent">
        <h2>Main Content</h2>
        <p>Resize the browser window to see the effect of media queries.</p>

        <div class="img">
          <div class="image-wrapper">
            <img src="src/images/horse.jpg" alt="Crazy Horse" />
          </div>
          <div class="image-wrapper">
            <img src="src/images/laugh.jpg" alt="Laughing Person" />
          </div>
          <div class="image-wrapper">
            <img src="src/images/pillowHead.png" alt="Man with Pillow on Head"/>
          </div>
        </div>
      </article>
    </div>

    <footer>
      <p>
        Footer content goes here. It will also respond to changes in the
        viewport size.
      </p>
    </footer>
  </body>
</html>
