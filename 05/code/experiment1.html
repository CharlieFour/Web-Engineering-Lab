<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Bookstore - Wireframe Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navigation -->
    <header>
        <div class="logo">📚 BookStore</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Cart</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Banner Section -->
    <section class="banner">
        <h1>Welcome to Our Online Bookstore</h1>
        <p>Discover your next favorite book.</p>
        <button onclick="alert('Explore Books Clicked!')">Explore Books</button>
    </section>

    <!-- Product Section -->
    <section class="products">
        <h2>Featured Books</h2>

        <div class="product-grid">
            <div class="card">
                <div class="image-placeholder">Book Image</div>
                <h3>Book Title 1</h3>
                <p>$15.99</p>
                <button onclick="alert('Added to Cart!')">Add to Cart</button>
            </div>

            <div class="card">
                <div class="image-placeholder">Book Image</div>
                <h3>Book Title 2</h3>
                <p>$12.99</p>
                <button onclick="alert('Added to Cart!')">Add to Cart</button>
            </div>

            <div class="card">
                <div class="image-placeholder">Book Image</div>
                <h3>Book Title 3</h3>
                <p>$18.99</p>
                <button onclick="alert('Added to Cart!')">Add to Cart</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Online Bookstore | Prototype Version</p>
    </footer>

</body>
</html>
