<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 02 - University Form</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <h1><i class="fas fa-file-alt"></i> Task 02: University Review Form</h1>
    
    <section class="form-section">
        <form action="http://www.bahria.com" method="post">
            <section>
                <h2><i class="fas fa-user"></i> Personal Information</h2>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="Enter your full name">
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email address">
                <br><br>
            </section>
            
            <section>
                <h2><i class="fas fa-heart"></i> What do you like the most about our university?</h2>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="like" value="campus"> <i class="fas fa-university"></i> Campus</label>
                    <label><input type="checkbox" name="like" value="student"> <i class="fas fa-users"></i> Students</label>
                    <label><input type="checkbox" name="like" value="location"> <i class="fas fa-map-marker-alt"></i> Location</label>
                    <label><input type="checkbox" name="like" value="atmosphere"> <i class="fas fa-cloud-sun"></i> Atmosphere</label>
                    <label><input type="checkbox" name="like" value="dormrooms"> <i class="fas fa-bed"></i> Dorm Rooms</label>
                    <label><input type="checkbox" name="like" value="sports"> <i class="fas fa-futbol"></i> Sports</label>
                </div>
            </section>
            
            <section>
                <h2><i class="fas fa-question-circle"></i> How did you become interested in our university?</h2>
                <div class="radio-group">
                    <label><input type="radio" name="source" value="friends" checked> <i class="fas fa-user-friends"></i> Friends</label>
                    <label><input type="radio" name="source" value="television"> <i class="fas fa-tv"></i> Television</label>
                    <label><input type="radio" name="source" value="internet"> <i class="fas fa-globe"></i> Internet</label>
                    <label><input type="radio" name="source" value="others"> <i class="fas fa-ellipsis-h"></i> Others</label>
                </div>
            </section>
            
            <section>
                <h2><i class="fas fa-comment"></i> Additional Comments</h2>
                <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Please share any additional comments or questions..."></textarea>
                <br><br>
                
                <div class="form-buttons">
                    <input type="submit" value="Submit Form">
                    <input type="reset" value="Clear Form">
                </div>
            </section>
        </form>
    </section>
    
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Lab 02 Main Page</a>
    
    <footer>
        <p>© 2026 Web Development Lab | CSS Styling Applied</p>
    </footer>
</body>
</html>
