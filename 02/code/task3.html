<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Task 3</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="kindergarten-header">
        <h1>Welcome to Kindergarten Learning</h1>
        <p>Fun with music and rhymes 🎵</p>
    </header>

    <section class="content-section">
        <h2>National Anthem</h2>

        <figure class="media-item">
            <audio controls>
                <source src="https://www.pakistanembassy.dk/wp-content/uploads/2021/03/Pakistan-National-Anthem.mp3" type="audio/mpeg">
            </audio>
            <figcaption>National Anthem Audio</figcaption>
        </figure>
    </section>

    <section class="content-section">
        <h2>Famous Kids Rhymes</h2>

        <div class="media-container">
            <figure class="media-item">
                <video width="250" controls>
                    <source src="src\video\TwinkleTwinkleLittleStar.mp4" type="video/mp4">
                </video>
                <figcaption>Twinkle Twinkle Little Star</figcaption>
            </figure>

            <figure class="media-item">
                <video width="250" controls>
                    <source src="src\video\JohnyJohnyYesPapa.mp4" type="video/mp4">
                </video>
                <figcaption>Johny Johny Yes Papa</figcaption>
            </figure>

            <figure class="media-item">
                <video width="250" controls>
                    <source src="src\video\BabyShark.mp4" type="video/mp4">
                </video>
                <figcaption>Baby Shark</figcaption>
            </figure>

            <figure class="media-item">
                <video width="250" controls>
                    <source src="src\video\WheelsOnTheBus.mp4" type="video/mp4">
                </video>
                <figcaption>Wheels on the Bus</figcaption>
            </figure>

            <figure class="media-item">
                <video width="250" controls>
                    <source src="src\video\HumptyDumpty.mp4" type="video/mp4">
                </video>
                <figcaption>Humpty Dumpty</figcaption>
            </figure>
        </div>
    </section>

    <section class="contact-section">
        <h2>Contact Us</h2>

        <a href="mailto:school@kindergarten.com">
            <img src="email.png" alt="Click image to send email to kindergarten school" width="120">
        </a>
    </section>

    <footer>
        <p>© 2026 Kindergarten Learning Center</p>
    </footer>

</body>

</html>
